# cargo-deny policy, checked in CI (`deny` job in .github/workflows/rust.yml)
# against the committed Cargo.lock. Run locally with `cargo deny --locked check`.

[graph]
# The nightly-only `bvh8` feature adds no dependency; the default features
# are what ships.
all-features = false

[advisories]
# Report soundness advisories for every crate in the graph, not only direct
# dependencies: "safe Rust" is a property of the whole binary.
unsound = "all"
unmaintained = "all"
ignore = [
    # `paste` is unmaintained, not vulnerable; it is a build-time proc macro
    # reached through `exr` -> `pulp`, and nothing here can replace it.
    { id = "RUSTSEC-2024-0436", reason = "build-time proc macro via exr -> pulp; unmaintained, no known vulnerability" },
]

[licenses]
# Every licence currently in the graph, all permissive. A new one fails the
# check and has to be added here deliberately.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# Boost (BSL-1.0) is permissive, but allowed only where it is needed: the
# hash `ocio` builds its processor cache keys with.
exceptions = [
    { allow = ["BSL-1.0"], crate = "xxhash-rust" },
]

[bans]
# Duplicates are all upstream-driven today (bitflags, hashbrown,
# miniz_oxide, syn, windows-sys); watch them, don't fail on them.
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the workspace carry no version requirement.
allow-wildcard-paths = true
# Strata 2027 conformance (https://github.com/OxidePicturesAlliance/Strata):
# exactly one copy of each vocabulary crate (its types cross library
# boundaries) and of each mineral (a second copy, even of the same version
# from another source, is a second, incompatible set of types). The same
# list as Strata's own deny.toml, minus `vdb`, which crust does not use.
deny = [
    # Vocabulary crates.
    { crate = "bytemuck", deny-multiple-versions = true },
    { crate = "glam", deny-multiple-versions = true },
    { crate = "half", deny-multiple-versions = true },
    { crate = "num-traits", deny-multiple-versions = true },
    { crate = "rayon", deny-multiple-versions = true },
    { crate = "serde", deny-multiple-versions = true },
    # Minerals.
    { crate = "ocio", deny-multiple-versions = true },
    { crate = "openqmc-rs", deny-multiple-versions = true },
    { crate = "opensubdiv-rs", deny-multiple-versions = true },
    { crate = "openusd", deny-multiple-versions = true },
    { crate = "openusd-schemas", deny-multiple-versions = true },
    { crate = "ptex-rust", deny-multiple-versions = true },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The one git dependency, resolved to a commit in Cargo.lock: openusd /
# openusd-schemas, patched to `main` (see `[patch.crates-io]` in the workspace
# Cargo.toml). Everything else, opensubdiv-rs included, comes from crates.io.
allow-git = [
    "https://github.com/mxpv/openusd",
]
