[package]
name = "crust-jit"
version = { workspace = true }
edition = { workspace = true }
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Cranelift JIT for crust-mtlx shading programs: exact IEEE ops inline, everything else through the interpreter's own step."

[lib]
name = "crust_jit"
path = "src/lib.rs"

[dependencies]
crust-mtlx = { path = "../crust-mtlx" }
# Pure-Rust code generation (the workspace takes no C++ toolchain). One
# version for all five: they are released in lockstep.
cranelift-codegen = "0.137"
cranelift-frontend = "0.137"
cranelift-jit = "0.137"
cranelift-module = "0.137"
cranelift-native = "0.137"

[dev-dependencies]
glam.workspace = true
