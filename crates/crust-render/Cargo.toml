[package]
name = "crust-render"
version = { workspace = true }
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The library is the CLI's import-and-check policy and, with `session`, the
# live session's core a host keeps. The package keeps the repository's name;
# the executable is `crust`.
[lib]
path = "src/lib.rs"

[[bin]]
name = "crust"
path = "src/main.rs"

[features]
# Print per-ray BVH traversal counts in --stats. Diagnostic: the counters
# are global atomics, so counts are trustworthy and timings are not.
traversal-stats = ["crust-core/traversal-stats"]
# Nightly only: 8-wide BVH nodes (crust-rt's `bvh8`).
bvh8 = ["crust-core/bvh8"]
# MaterialX shading programs compiled to machine code (see crust-core's `jit`
# feature). `--no-default-features` builds the interpreter-only renderer.
default = ["jit", "mmap"]
jit = ["crust-core/jit"]
# The import reads USD files through read-only memory mappings (see
# crust-core's `mmap` feature). `--no-default-features` builds a renderer
# that never maps a file and copies each one into memory, with no `unsafe`
# opt-in compiled.
mmap = ["crust-core/mmap"]
# The live session's core (`session`): an override layer followed on disk,
# each change classified and applied in place or by a re-import. Needs only
# openusd (through Moho), which authors and diffs the layer.
session = ["dep:moho"]

[dependencies]
crust-core = { path = "../crust-core" }
# Everything that decodes a file lives in crust-assets; this binary only
# writes: `exr` for the linear EXR, `image` for the tone-mapped PNG.
crust-assets = { path = "../crust-assets" }
clap = { version = "4.5.48", features = ["derive"] }
image.workspace = true
indicatif = "0.18.0"
tracing.workspace = true
exr.workspace = true
# Ctrl-C: the first one cancels the render through its `RenderControl` and
# the partial outputs are written. Its `unsafe` is in installing the signal
# handler, never on the render path; this crate stays `forbid(unsafe_code)`.
ctrlc = "3.4"
# `session`: the session authors and diffs its override layer through
# openusd, reached as `moho::openusd`, the same crate crust-core imports with.
moho = { workspace = true, optional = true }

# The probe examples read a stage directly (`ptex_verify`, `proto_probe`,
# `rel_probe`, ...) and read `.ptx` headers and faces through the raw reader
# (`tex_probe`, `ptex_seams`) — the decoded `PtexColor` deliberately does not
# replace those, since they sample without the colour decode.
[dev-dependencies]
moho.workspace = true
ptex.workspace = true
# `std` for `tracing::subscriber::with_default`, which the product writer's
# test uses to see the warning an authored `crust:*` attribute gets.
tracing = { workspace = true, features = ["std"] }
# The CLI tests read the JSON reports back (crust-core serializes them);
# crust-core already depends on it, so it adds no package.
serde_json = "1.0.151"

[dependencies.tracing-subscriber]
version = "0.3.20"
features = ["fmt"]
